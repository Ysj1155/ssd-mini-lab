# External SSD black-box validation matrix
#
# Purpose:
#   Prepare product-like fio test conditions for an external SSD DUT.
#
# Safety:
#   Use a file target on the intended external SSD path.
#   Do not use raw physical drives.
#   Keep the test file path explicit before running fio.

dut:
  label: external_ssd_dut_01
  target_file: "E:\\validation\\ssd_lab_fio_testfile"
  notes:
    - "Target path is the dedicated validation folder on the external SSD."
    - "This is black-box file-based validation, not raw NAND/FTL evidence."

common:
  fio_output_format: json
  ioengine: windowsaio
  direct: 1
  numjobs: 1
  group_reporting: 1
  time_based: 1

test_cases:

  - id: EXT-PERF-RR-QD-SWEEP
    purpose: "Observe random-read scaling and p99 latency across queue depth."
    rw: randread
    bs: 4k
    size: 512M
    runtime_sec: 30
    repeats: 3
    iodepth: [1, 4, 16, 32]
    requirement_links:
      - REQ-PERF-001
      - REQ-QOS-001
      - REQ-REPRO-001

  - id: EXT-PERF-RW-QD-SWEEP
    purpose: "Observe random-write scaling and p99 latency across queue depth."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 30
    repeats: 3
    iodepth: [1, 4, 16, 32]
    requirement_links:
      - REQ-PERF-002
      - REQ-QOS-001
      - REQ-REPRO-001

  - id: EXT-SUST-WRITE-120S
    purpose: "Check short sustained random-write behavior and tail latency."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 120
    repeats: 3
    iodepth: [16]
    requirement_links:
      - REQ-SUST-001
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-OBS-001

  - id: EXT-SUST-WRITE-300S
    purpose: "Check whether longer random-write runtime exposes worse tail behavior."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 300
    repeats: 3
    iodepth: [16]
    requirement_links:
      - REQ-SUST-001
      - REQ-SUST-002
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-OBS-001

  - id: EXT-SUST-READ-120S
    purpose: "Compare sustained read behavior against sustained write behavior."
    rw: randread
    bs: 4k
    size: 512M
    runtime_sec: 120
    repeats: 3
    iodepth: [16]
    requirement_links:
      - REQ-SUST-003
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-OBS-001

  - id: EXT-SUST-READ-QD32-120S
    purpose: "Check whether the higher-throughput QD32 random-read condition exposes worse sustained tail latency."
    rw: randread
    bs: 4k
    size: 512M
    runtime_sec: 120
    repeats: 3
    iodepth: [32]
    requirement_links:
      - REQ-SUST-003
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-OBS-001

  - id: EXT-SUST-WRITE-QD32-120S
    purpose: "Check whether the QD32 random-write condition repeats the short-sweep QoS instability under sustained runtime."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 120
    repeats: 3
    iodepth: [32]
    requirement_links:
      - REQ-SUST-001
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-OBS-001

  - id: EXT-SUST-WRITE-QD32-300S
    purpose: "Escalate the QD32 random-write QoS risk candidate from 120s to 300s sustained runtime."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 300
    repeats: 3
    iodepth: [32]
    requirement_links:
      - REQ-SUST-001
      - REQ-SUST-002
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-OBS-001

  - id: EXT-STATE-IDLE-START-PROBE
    purpose: "Measure QD16 behavior after a fixed five-minute host-visible idle interval."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 120
    repeats: 3
    iodepth: [16]
    requirement_links:
      - REQ-STATE-001
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-OBS-001

  - id: EXT-STATE-WRITE-CONDITION
    purpose: "Apply one fixed QD32 random-write conditioning phase before the post-write probe."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 300
    repeats: 1
    iodepth: [32]
    requirement_links:
      - REQ-STATE-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-STATE-POST-WRITE-PROBE
    purpose: "Measure QD16 behavior after fixed write conditioning and a 60-second idle interval."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 120
    repeats: 3
    iodepth: [16]
    requirement_links:
      - REQ-STATE-001
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-OBS-001

  - id: EXT-STATE-REPRO-BASELINE
    purpose: "Measure one QD16 baseline probe in an independently initiated paired session."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 120
    repeats: 1
    iodepth: [16]
    requirement_links:
      - REQ-STATE-REPRO-002
      - REQ-QOS-001
      - REQ-OBS-001

  - id: EXT-STATE-REPRO-CONDITION
    purpose: "Apply one fixed QD32 write-conditioning phase within a paired session."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 300
    repeats: 1
    iodepth: [32]
    requirement_links:
      - REQ-STATE-REPRO-002
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-STATE-REPRO-POST
    purpose: "Measure one QD16 post-write probe in the same paired session."
    rw: randwrite
    bs: 4k
    size: 512M
    runtime_sec: 120
    repeats: 1
    iodepth: [16]
    requirement_links:
      - REQ-STATE-REPRO-002
      - REQ-QOS-001
      - REQ-OBS-001
  - id: EXT-LARGE-WS-SEQ-WRITE-32G
    purpose: "Observe completion-based sequential-write behavior across a 32 GiB file target."
    rw: write
    bs: 1M
    size: 32G
    execution_mode: completion_based
    repeats: 1
    iodepth: [4]
    requirement_links:
      - REQ-LARGE-WS-001
      - REQ-QOS-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-LARGE-WS-SEQ-READ-32G
    purpose: "Observe completion-based sequential-read behavior across the same 32 GiB file target."
    rw: read
    bs: 1M
    size: 32G
    execution_mode: completion_based
    repeats: 1
    iodepth: [4]
    requirement_links:
      - REQ-LARGE-WS-001
      - REQ-QOS-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-MIXED-RW-7030-4K-QD16
    purpose: "Observe concurrent read/write interference and per-direction QoS under a synthetic 70:30 4K random workload."
    rw: randrw
    rwmixread: 70
    rwmixwrite: 30
    bs: 4k
    size: 32G
    runtime_sec: 180
    repeats: 3
    inter_run_idle_sec: 60
    iodepth: [16]
    randrepeat: 1
    requirement_links:
      - REQ-MIXED-001
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-MIXED-CONTROL-RANDREAD-4K-QD16
    purpose: "Provide a matched 100% random-read control for the 70:30 mixed workload."
    rw: randread
    bs: 4k
    size: 32G
    runtime_sec: 180
    repeats: 3
    inter_run_idle_sec: 60
    iodepth: [16]
    randrepeat: 1
    requirement_links:
      - REQ-MIXED-CTRL-002
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-MIXED-CONTROL-RANDWRITE-4K-QD16
    purpose: "Provide a matched 100% random-write control for the 70:30 mixed workload."
    rw: randwrite
    bs: 4k
    size: 32G
    runtime_sec: 180
    repeats: 3
    inter_run_idle_sec: 60
    iodepth: [16]
    randrepeat: 1
    requirement_links:
      - REQ-MIXED-CTRL-002
      - REQ-QOS-001
      - REQ-REPRO-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-MIXED-ABBA-PURE-READ
    purpose: "Provide the A1/A2 pure-read positions in the matched ABBA read-QoS experiment."
    rw: randread
    bs: 4k
    size: 32G
    runtime_sec: 180
    repeats: 2
    iodepth: [16]
    randrepeat: 1
    sequence_positions: [A1, A2]
    requirement_links:
      - REQ-MIXED-ABBA-003
      - REQ-QOS-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-MIXED-ABBA-7030
    purpose: "Provide the B1/B2 mixed positions in the matched ABBA read-QoS experiment."
    rw: randrw
    rwmixread: 70
    rwmixwrite: 30
    bs: 4k
    size: 32G
    runtime_sec: 180
    repeats: 2
    iodepth: [16]
    randrepeat: 1
    sequence_positions: [B1, B2]
    requirement_links:
      - REQ-MIXED-ABBA-003
      - REQ-QOS-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-MIXED-BAAB-PURE-READ
    purpose: "Provide the A1/A2 pure-read positions in an independent reconnect-start BAAB session."
    rw: randread
    bs: 4k
    size: 32G
    runtime_sec: 180
    repeats: 2
    iodepth: [16]
    randrepeat: 1
    sequence_positions: [A1, A2]
    requirement_links:
      - REQ-MIXED-BAAB-004
      - REQ-QOS-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-MIXED-BAAB-7030
    purpose: "Provide the B1/B2 mixed positions in an independent reconnect-start BAAB session."
    rw: randrw
    rwmixread: 70
    rwmixwrite: 30
    bs: 4k
    size: 32G
    runtime_sec: 180
    repeats: 2
    iodepth: [16]
    randrepeat: 1
    sequence_positions: [B1, B2]
    requirement_links:
      - REQ-MIXED-BAAB-004
      - REQ-QOS-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-MIXED-RATIO-SWEEP-001
    purpose: "Map 90:10, 70:30, and 50:50 mixed response while counterbalancing sequence position after the ABBA/BAAB hypothesis was not reproduced."
    rw: randrw
    rwmixread: [90, 70, 50]
    rwmixwrite: [10, 30, 50]
    bs: 4k
    size: 32G
    runtime_sec: 180
    cycles: 3
    phases: 9
    inter_phase_idle_sec: 60
    inter_cycle_idle_sec: 300
    iodepth: [16]
    randrepeat: 1
    sequence:
      - ["90:10", "70:30", "50:50"]
      - ["70:30", "50:50", "90:10"]
      - ["50:50", "90:10", "70:30"]
    interpretation: "descriptive_ratio_by_cycle_by_position_mapping"
    requirement_links:
      - REQ-MIXED-RATIO-005
      - REQ-QOS-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001

  - id: EXT-MIXED-RATIO-SWEEP-REPRO-002
    purpose: "Challenge Session 1 ratio response and phase-transition behavior in an independent reconnect-start session with a different counterbalanced order."
    rw: randrw
    rwmixread: [50, 70, 90]
    rwmixwrite: [50, 30, 10]
    bs: 4k
    size: 32G
    runtime_sec: 180
    cycles: 3
    phases: 9
    inter_phase_idle_sec: 60
    inter_cycle_idle_sec: 300
    iodepth: [16]
    randrepeat: 1
    sequence_variant: session2
    sequence:
      - ["50:50", "70:30", "90:10"]
      - ["70:30", "90:10", "50:50"]
      - ["90:10", "50:50", "70:30"]
    interpretation: "independent_reproduction_of_descriptive_mapping"
    requirement_links:
      - REQ-MIXED-RATIO-REPRO-006
      - REQ-QOS-001
      - REQ-ENV-001
      - REQ-OBS-001
      - REQ-TRACE-001
